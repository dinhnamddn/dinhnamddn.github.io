<header class="site-header">
    <a class="brand" href="index.html">DDN<span>.</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
        <span class="sr-only">Toggle navigation</span>
        <span></span><span></span><span></span>
    </button>
    <nav id="site-navigation" class="site-navigation" aria-label="Primary navigation">
        <a href="index.html">About me</a>
        <a href="projects.html">Projects</a>
        <a href="research.html">Research</a>
        <a href="automotive.html">Automotive</a>
        <!-- <a href="maps.html">Maps</a> -->
        <a href="contact.html">Contact</a>
    </nav>
</header>

<script>
    (function () {
        var currentPage = window.location.pathname.split("/").pop() || "index.html";
        var links = document.querySelectorAll(".site-navigation a");
        links.forEach(function (link) {
            if (link.getAttribute("href") === currentPage) {
                link.classList.add("active");
                link.setAttribute("aria-current", "page");
            }
        });

        var toggle = document.querySelector(".menu-toggle");
        var navigation = document.querySelector(".site-navigation");
        toggle.addEventListener("click", function () {
            var expanded = toggle.getAttribute("aria-expanded") === "true";
            toggle.setAttribute("aria-expanded", String(!expanded));
            navigation.classList.toggle("open");
        });
    }());
</script>
